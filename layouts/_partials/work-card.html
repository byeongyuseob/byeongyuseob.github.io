<a class="card work" href="{{ .RelPermalink }}">
<div class="stack-sm">
<h3>{{ .Title }}</h3>
<span class="mono small muted meta">{{ .Params.period }}{{ with .Params.role }} · {{ . }}{{ end }}</span>
{{ with .Params.summary }}<p class="small muted">{{ . }}</p>{{ end }}
</div>
{{ with .Params.result }}<span class="result">{{ . }}</span>{{ end }}
{{ with .Params.stack }}<ul class="tags tags-sm">{{ range first 4 . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
</a>
