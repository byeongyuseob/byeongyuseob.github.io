{{- .Page.Store.Set "hasViz" true -}}
<figure class="viz scoresim" data-scoresim>
<figcaption class="viz-title">포트 등급 판정 · 이상 징후를 골라 보세요</figcaption>
<div class="score-items">
<label class="score-item"><input type="checkbox" data-pt="100" data-layer="증상"><span class="score-name">신호 품질 불량 (BSI)</span><span class="score-pt">증상</span></label>
<label class="score-item"><input type="checkbox" data-pt="30" data-layer="증상" data-ber><span class="score-name">BER 기준 초과</span><span class="score-pt">증상</span></label>
<label class="score-item"><input type="checkbox" data-pt="8" data-layer="증상"><span class="score-name">에러 카운터 증가</span><span class="score-pt">증상</span></label>
<label class="score-item"><input type="checkbox" data-pt="5" data-layer="원인"><span class="score-name">광모듈 온도 상승</span><span class="score-pt">원인</span></label>
<label class="score-item score-select"><span class="score-name">link flap (24시간)</span><span class="score-pt">결과</span>
<select data-flap>
<option value="0">없음</option>
<option value="15">1회</option>
<option value="30">2회</option>
<option value="50">3회 이상</option>
</select></label>
<label class="score-item"><input type="checkbox" data-down><span class="score-name">link down 유지</span><span class="score-pt">결과</span></label>
</div>
<div class="score-bar"><div class="score-fill" data-fill></div></div>
<div class="score-out"><span class="score-total">위험도</span><span class="score-grade" data-grade>정상</span></div>
<p class="viz-detail" data-score-text aria-live="polite"></p>
<p class="viz-note">등급은 하루 1회 갱신됩니다. 실제 룰은 항목마다 가중치를 둔 점수제인데, 세부 값은 글에서 뺐습니다.</p>
</figure>
